name: cpg-cache

services:
  redis:
    image: redis:latest
    container_name: redis
    command: [
      "redis-server",
      "--requirepass", "password"
    ]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    depends_on:
      - redis
    ports:
      - "5540:5540"
    volumes:
      - redis_insight_data:/data
    restart: unless-stopped

  # Redis Cluster (3 masters + 3 replicas) - opt-in alternative to the single-node `redis`
  # service above, for testing REDIS_MODE=cluster locally against a real cluster instead of
  # just single-node. Same password ("password") as `redis` above, so switching the app
  # between the two is just env vars (REDIS_MODE, REDIS_CLUSTER_NODES, REDISSON_SERVER,
  # REDISSON_CLUSTER_NODES) - no compose or app-code change, and REDIS_PASS stays untouched.
  #
  # Off by default - only starts with `docker compose -f compose/cache.yml --profile
  # redis-cluster up -d` (plain `up -d` skips it, so it doesn't eat resources when unused).
  #
  # All 6 nodes attach to redis-cluster-1's network namespace (`network_mode:
  # service:redis-cluster-1`) instead of the default bridge network. This is the standard
  # workaround for running a real multi-container Redis Cluster on Docker Desktop
  # (Windows/Mac), where `network_mode: host` isn't reliably available: sharing one
  # namespace means the nodes gossip with each other over 127.0.0.1 (cluster-announce-ip)
  # while still being reachable from the Windows host at that exact same loopback
  # address/ports - a real 3rd-party cluster wouldn't need this, only local Docker Desktop
  # testing does.
  redis-cluster-1:
    image: redis:latest
    container_name: redis-cluster-1
    profiles: ["redis-cluster"]
    command: >
      redis-server
      --port 7000
      --cluster-enabled yes
      --cluster-config-file nodes-7000.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip 127.0.0.1
      --appendonly yes
      --dir /data
      --requirepass password
      --masterauth password
    ports:
      - "7000-7005:7000-7005"
      - "17000-17005:17000-17005"
    volumes:
      - redis_cluster_data_1:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7000", "-a", "password", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis-cluster-2:
    image: redis:latest
    container_name: redis-cluster-2
    profiles: ["redis-cluster"]
    network_mode: "service:redis-cluster-1"
    depends_on:
      - redis-cluster-1
    command: >
      redis-server
      --port 7001
      --cluster-enabled yes
      --cluster-config-file nodes-7001.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip 127.0.0.1
      --appendonly yes
      --dir /data
      --requirepass password
      --masterauth password
    volumes:
      - redis_cluster_data_2:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7001", "-a", "password", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis-cluster-3:
    image: redis:latest
    container_name: redis-cluster-3
    profiles: ["redis-cluster"]
    network_mode: "service:redis-cluster-1"
    depends_on:
      - redis-cluster-1
    command: >
      redis-server
      --port 7002
      --cluster-enabled yes
      --cluster-config-file nodes-7002.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip 127.0.0.1
      --appendonly yes
      --dir /data
      --requirepass password
      --masterauth password
    volumes:
      - redis_cluster_data_3:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7002", "-a", "password", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis-cluster-4:
    image: redis:latest
    container_name: redis-cluster-4
    profiles: ["redis-cluster"]
    network_mode: "service:redis-cluster-1"
    depends_on:
      - redis-cluster-1
    command: >
      redis-server
      --port 7003
      --cluster-enabled yes
      --cluster-config-file nodes-7003.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip 127.0.0.1
      --appendonly yes
      --dir /data
      --requirepass password
      --masterauth password
    volumes:
      - redis_cluster_data_4:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7003", "-a", "password", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis-cluster-5:
    image: redis:latest
    container_name: redis-cluster-5
    profiles: ["redis-cluster"]
    network_mode: "service:redis-cluster-1"
    depends_on:
      - redis-cluster-1
    command: >
      redis-server
      --port 7004
      --cluster-enabled yes
      --cluster-config-file nodes-7004.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip 127.0.0.1
      --appendonly yes
      --dir /data
      --requirepass password
      --masterauth password
    volumes:
      - redis_cluster_data_5:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7004", "-a", "password", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis-cluster-6:
    image: redis:latest
    container_name: redis-cluster-6
    profiles: ["redis-cluster"]
    network_mode: "service:redis-cluster-1"
    depends_on:
      - redis-cluster-1
    command: >
      redis-server
      --port 7005
      --cluster-enabled yes
      --cluster-config-file nodes-7005.conf
      --cluster-node-timeout 5000
      --cluster-announce-ip 127.0.0.1
      --appendonly yes
      --dir /data
      --requirepass password
      --masterauth password
    volumes:
      - redis_cluster_data_6:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7005", "-a", "password", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # One-shot bootstrap: wires the 6 nodes above into an actual cluster (3 masters, each with 1
  # replica). Safe to re-run (`up -d` again) - if the nodes already belong to a cluster (state
  # persisted in their volumes' nodes-*.conf), the `--cluster create` call fails harmlessly
  # and the `|| echo` keeps this container exiting 0.
  redis-cluster-init:
    image: redis:latest
    container_name: redis-cluster-init
    profiles: ["redis-cluster"]
    network_mode: "service:redis-cluster-1"
    depends_on:
      redis-cluster-1:
        condition: service_healthy
      redis-cluster-2:
        condition: service_healthy
      redis-cluster-3:
        condition: service_healthy
      redis-cluster-4:
        condition: service_healthy
      redis-cluster-5:
        condition: service_healthy
      redis-cluster-6:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >
        redis-cli -a password --no-auth-warning --cluster create
        127.0.0.1:7000 127.0.0.1:7001 127.0.0.1:7002
        127.0.0.1:7003 127.0.0.1:7004 127.0.0.1:7005
        --cluster-replicas 1 --cluster-yes
        || echo "Cluster already initialized, skipping."
    restart: "no"

# Named "cpg-cache" (not the project-default auto name) so compose/ai.yml can attach
# chromadb to it as an `external: true` network - see compose/ai.yml for why. Only
# redis-cluster-1 actually joins this network explicitly; nodes 2-6 and the init job
# use `network_mode: service:redis-cluster-1` instead (required for their loopback
# gossip trick - see the comment above redis-cluster-1), which rides on whatever
# network redis-cluster-1 is attached to, so they don't need their own entry.
networks:
  default:
    name: cpg-cache

# Pinned to explicit "cpg_*" names (rather than the "cpg-cache_*" Compose would
# auto-generate from the project name) so volume names stay stable and predictable.
volumes:
  redis_data:
    name: cpg_redis_data
  redis_insight_data:
    name: cpg_redis_insight_data
  redis_cluster_data_1:
    name: cpg_redis_cluster_data_1
  redis_cluster_data_2:
    name: cpg_redis_cluster_data_2
  redis_cluster_data_3:
    name: cpg_redis_cluster_data_3
  redis_cluster_data_4:
    name: cpg_redis_cluster_data_4
  redis_cluster_data_5:
    name: cpg_redis_cluster_data_5
  redis_cluster_data_6:
    name: cpg_redis_cluster_data_6
