# Custom pg_hba.conf - loaded via `-c hba_file=...` so it lives outside PGDATA
# (avoids clashing with the file initdb already wrote into the postgres_data volume).
#
# TYPE  DATABASE        USER            ADDRESS                 METHOD
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
host    all             all             0.0.0.0/0               md5

# Replication - lets postgres-replica-1/2 (and pgpool's SR check) stream from this node.
host    replication     repl_user       0.0.0.0/0               md5
